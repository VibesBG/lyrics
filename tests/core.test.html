<!doctype html><meta charset="utf-8"><body>
<script src="../src/core.js"></script>
<script>
let n=0; const fails=[];
function eq(name,a,b){ try{ const A=typeof a==='function'?a():a; if(JSON.stringify(A)===JSON.stringify(b)) n++; else fails.push('FAIL: '+name+' got '+JSON.stringify(A)); }catch(e){ fails.push('FAIL: '+name+' threw '+e.message); } }
function T(){
eq('stanzas split on blank line', ()=>parseLyrics('a\nb\n\nc').map(s=>s.lines), [['a','b'],['c']]);
eq('label taken off', ()=>parseLyrics('Chorus\nla la\n\nVerse 2:\nx').map(s=>[s.label,s.lines]), [['Chorus',['la la']],['Verse 2',['x']]]);
eq('bracket label', ()=>parseLyrics('[Bridge]\nyo')[0].label, 'Bridge');
eq('bulgarian label', ()=>parseLyrics('Припев:\nдо ре ми')[0].label, 'Припев');
eq('chorus shaded', ()=>parseLyrics('Verse\na\n\nChorus\nb').map(s=>s.rep), [false,true]);
eq('repeated text shaded', ()=>parseLyrics('x y\n\nz\n\nx y').map(s=>s.rep), [true,false,true]);
eq('label alone kept as a line', ()=>parseLyrics('a\n\nChorus').map(s=>[s.label,s.lines,s.rep]), [[null,['a'],false],['Chorus',[],true]]);
eq('normal line not a label', ()=>parseLyrics('Chorus girl is singing')[0].label, null);
eq('hash stable', ()=>hashText('abc')===hashText('abc')&&hashText('abc')!==hashText('abd')&&/^h[0-9a-f]+$/.test(hashText('abc')), true);
eq('validate v1', ()=>validateLyricsFile({kind:'lyrics-pack',v:1,gigs:[{id:'mybar',name:'A',sets:[]}],texts:{}}).ok, true);
eq('validate wrong kind', ()=>validateLyricsFile({kind:'setlists-gigs',gigs:[]}).ok, false);
eq('conflicts', ()=>importConflicts([{id:'a'}],[{id:'a'},{id:'b'}]), ['a']);
const lib={kind:'lyrics-pack',v:1,gigs:[{id:'a',name:'A',sets:[]}],texts:{t1:'one'}};
const file={kind:'lyrics-pack',v:2,gigs:[{id:'a',name:'A new',sets:[]},{id:'r',name:'R',sets:[]}],texts:{t2:'two'}};
eq('replace + union', ()=>{const L=applyLyricsImport(lib,file,'replace');return [L.v,L.gigs.map(g=>g.name),Object.keys(L.texts).sort()]}, [2,['A new','R'],['t1','t2']]);
eq('keep both', ()=>applyLyricsImport(lib,file,'keep').gigs.map(g=>g.id), ['a','a2','r']);
eq('lib untouched', ()=>lib.gigs[0].name, 'A');
const gigs=[{id:'g',name:'G',sets:[{name:'',songs:[{t:'Song',a:'Me',x:'old'},{t:'Empty'}]}]}];
eq('make file', ()=>{const f=makeLyricsFile(gigs,x=>x.t==='Song'?'la':'', '2026-11-11'); const s=f.gigs[0].sets[0].songs;
  return [validateLyricsFile(f).ok, s[0].x===hashText('la'), f.texts[s[0].x], s[1].x, s[0].a];}, [true,true,'la',undefined,'Me']);
eq('migrate played', ()=>{ const st={'played:mybar:1':true}; const g=[{id:'mybar',sets:[{name:'',songs:[{t:'A b'},{t:'Song One'}]}]}];
  migratePlayed(g,k=>st[k],(k,v)=>{st[k]=v},k=>{delete st[k]}); return Object.keys(st); }, ['played:mybar:songone']);

eq('lyrics: set without songs gets []', ()=>validateLyricsFile({kind:'lyrics-pack',v:2,gigs:[{id:'a',name:'A',sets:[{name:'S'}]}],texts:{}}).file.gigs[0].sets[0].songs, []);
eq('lyrics: bad songs dropped, texts must be strings', ()=>{const f=validateLyricsFile({kind:'lyrics-pack',v:2,gigs:[{id:'a',name:'A',sets:[{name:'',songs:[null,{t:''},{t:'Ok',a:5,x:'k'}]}]}],texts:{k:'words',z:7}}).file; return [f.gigs[0].sets[0].songs,f.texts];}, [[{t:'Ok',x:'k'}],{k:'words'}]);
eq('lyrics: sanitizeLib on stored data', ()=>sanitizeLib({kind:'lyrics-pack',v:1,gigs:[{id:'a',name:'A',sets:[{name:'S'}]}]}).gigs[0].sets[0].songs, []);
}
async function A(){
const big={kind:'lyrics-pack',v:2,from:'Дарин',gigs:[{id:'a',name:'Рейна',sets:[{name:'',songs:[{t:'Бесен',x:'h1'}]}]}],texts:{h1:'Ла ла ла\nна на на\n\n'.repeat(60)}};
const z=await packShare(big); eq('zip round trip', await unpackShare(z), big);
eq('zip code is url-safe', /^z[A-Za-z0-9_-]+$/.test(z), true);
eq('zip is much shorter', z.length<JSON.stringify(big).length/3, true);
const j=await packShare(big,true); eq('plain round trip', await unpackShare(j), big); eq('plain starts with j', j[0], 'j');
let bad=null; try{ await unpackShare('zNOTvalid'); }catch(e){ bad='threw'; } eq('broken code throws', bad, 'threw');
let cut=null; try{ await unpackShare(z.slice(0,z.length/2)); }catch(e){ cut='threw'; } eq('cut-off link throws', cut, 'threw');
eq('code from pasted message', shareCodeOf('Дарин sent you a gig: https://vibesbg.github.io/lyrics/#get=zAb_-9 ok'), 'zAb_-9');
eq('no code', shareCodeOf('#mybar-2'), null);
eq('sender name cleaned', senderName(' Йонко<script>\n '), 'Йонкоscript');
eq('sender name not a string', senderName({}), '');
const gig={id:'g',name:'G',sets:[{name:'Set 1',songs:[{t:'A'},{t:'B'},{t:'C'}]},{name:'Set 2',songs:[{t:'D'}]}]};
eq('pick some songs', pickSongs(gig,new Set([0,2])), {id:'g',name:'G',sets:[{name:'Set 1',songs:[{t:'A'},{t:'C'}]}]});
eq('pick drops empty sets', pickSongs(gig,new Set([3])).sets.map(s=>s.name), ['Set 2']);
eq('pick all keeps everything', pickSongs(gig,new Set([0,1,2,3])), gig);
}
try{T()}catch(e){fails.push('ERROR: '+e.message)}
A().catch(e=>fails.push('ERROR: '+e.message)).then(()=>{ document.body.textContent=fails.length?fails.join('\n'):'PASS '+n; });
</script>
