<!doctype html><meta charset="utf-8"><script>
const q=new URLSearchParams(location.search); localStorage.clear();
const ls=JSON.parse(q.get('ls')||'{}'); Object.entries(ls).forEach(([k,v])=>localStorage.setItem(k,typeof v==='string'?v:JSON.stringify(v)));
location.replace('../index.html'+(q.get('go')||''));
</script>
