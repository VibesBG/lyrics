<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">

<title>Gig Lyrics</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23121014'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='%23ff8f7a' font-family='Arial' font-weight='bold'%3E%E2%99%AA%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: gig chips + song list; song view = big readable lyric stanzas (repeating stanzas shaded so the chorus is easy to find), thumb-reach dock (prev · auto-scroll · next). Dark "stage" first, light "daylight". */
:root{
  --bg:#121014; --panel:#1b181f; --tint:#262029; --line:#332c38;
  --fg:#f3eef2; --muted:#9d93a3; --accent:#ff8f7a; --accent-ink:#2a0f0a; --accent-soft:rgba(255,143,122,.14);
  --ok:#6fd4a2; --shade:rgba(6,4,8,.6);
  --f-display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --f-body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  --scale:1;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f7f4f2; --panel:#ffffff; --tint:#f6e7e2; --line:#dfd5d2;
  --fg:#1a1418; --muted:#6c6168; --accent:#b8402c; --accent-ink:#ffffff; --accent-soft:rgba(184,64,44,.1);
  --ok:#1f8a58; --shade:rgba(20,14,18,.35);
  color-scheme:light;}}
:root[data-theme="light"]{
  --bg:#f7f4f2; --panel:#ffffff; --tint:#f6e7e2; --line:#dfd5d2;
  --fg:#1a1418; --muted:#6c6168; --accent:#b8402c; --accent-ink:#ffffff; --accent-soft:rgba(184,64,44,.1);
  --ok:#1f8a58; --shade:rgba(20,14,18,.35);
  color-scheme:light;}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg);margin:0}
body{font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;
  padding-top:env(safe-area-inset-top,0px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:1100px;margin:0 auto}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);
  display:flex;align-items:center;gap:8px;padding-block:10px;border-bottom:1px solid var(--line)}
.bar h1{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,6vw,40px);line-height:1;letter-spacing:.01em;
  text-transform:uppercase;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .num{color:var(--accent);margin-right:.3em}
.tool{flex:none;min-width:44px;height:44px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);
  cursor:pointer;font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px}

/* list */
.list{padding-block:14px 40px;display:grid;gap:16px}
.gigs{display:flex;gap:6px;overflow-x:auto;padding:4px;border-radius:14px;background:var(--panel);border:1px solid var(--line);scrollbar-width:none}
.gigs::-webkit-scrollbar{display:none}
.gig{flex:none;min-height:52px;border:0;border-radius:10px;background:transparent;cursor:pointer;padding:6px 14px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.gig b{font-family:var(--f-display);font-weight:800;font-size:20px;text-transform:uppercase;letter-spacing:.03em;line-height:1;white-space:nowrap}
.gig small{font-size:12px;color:var(--muted)}
.gig[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.gig[aria-selected="true"] small{color:var(--accent-ink);opacity:.8}
.findrow{display:flex;gap:8px}
.find{flex:1;min-width:0;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--panel);padding:0 14px;font-size:16px}
.find::placeholder{color:var(--muted)}
.tbtn{height:48px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:700;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;text-decoration:none}
.tbtn small{font-weight:400;color:var(--muted);font-size:12px}
.tbtn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tbtn[aria-pressed="true"]{border-color:var(--ok);color:var(--ok)}
.set h2{font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:20px;color:var(--muted);margin:0 0 8px;display:flex;gap:10px;align-items:baseline}
.set h2 small{font-family:var(--f-body);font-size:13px;letter-spacing:0;text-transform:none;font-weight:400}
.songs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:6px}
.row{display:flex;align-items:center;gap:12px;text-align:left;width:100%;min-height:56px;padding:10px 14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;cursor:pointer}
.row .n{font-weight:700;color:var(--muted);width:2.2ch;text-align:right;flex:none;font-variant-numeric:tabular-nums}
.row .t{flex:1;min-width:0;font-weight:700;font-size:17px}
.row .t small{display:block;font-weight:400;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .miss{flex:none;font-size:12px;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:2px 8px}
.row.current{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.row.played{opacity:.55}.row.played .n{color:var(--ok)}
.welcome{background:var(--panel);border:1px solid var(--accent);border-radius:16px;padding:16px 18px;display:grid;gap:10px}
.welcome h2{margin:0;font-family:var(--f-display);font-weight:800;text-transform:uppercase;font-size:26px}
.welcome p{margin:0;color:var(--muted);max-width:60ch}
.welcome .acts{display:flex;gap:8px;flex-wrap:wrap}
.empty{color:var(--muted);text-align:center;padding:26px 0}
mark{background:var(--accent-soft);color:inherit;border-radius:3px;padding:0 2px}

/* song */
.song{padding-block:14px 150px}
.tb{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;align-items:center}
.tb .meta{color:var(--muted);font-size:14px;margin-right:auto}
.lyrics{font-size:calc(22px*var(--scale));line-height:1.5;max-width:46ch;overflow-wrap:anywhere}
.lyrics.cols{max-width:none;column-count:2;column-gap:48px}
.st{margin:0 0 .9em;padding:.15em .6em;border-radius:10px;break-inside:avoid}
.st .l{display:block;padding-left:1.1em;text-indent:-1.1em;min-height:1em}
.st.rep{background:var(--tint)}
.st .lbl{display:block;font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:.7em;color:var(--muted);margin-bottom:.15em}
.st .first{font-weight:700}
.nolyr{background:var(--panel);border:1px dashed var(--line);border-radius:16px;padding:18px;display:grid;gap:12px;max-width:560px}
.nolyr p{margin:0;color:var(--muted)}
.nolyr .acts{display:flex;gap:8px;flex-wrap:wrap}
.mynote{margin-top:22px;display:grid;gap:6px;max-width:46ch}
.mynote label{font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-size:17px}
.mynote textarea{width:100%;min-height:80px;border-radius:12px;border:1px solid var(--line);background:var(--panel);padding:10px 12px;resize:vertical;font-size:16px}
@media (max-width:820px){.lyrics.cols{column-count:1}}

/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dock-in{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:1fr auto 1fr;gap:8px}
.nav{min-height:60px;border-radius:12px;border:1px solid var(--line);background:var(--panel);cursor:pointer;display:flex;flex-direction:column;justify-content:center;padding:6px 14px;text-align:left;min-width:0}
.nav.next{text-align:right;background:var(--accent-soft);border-color:var(--accent)}
.nav small{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav b{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav:disabled{opacity:.35;cursor:default}
.scroller{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}
.scroller button{height:60px;border:0;background:transparent;cursor:pointer}
.scroller .sm{width:34px;font-size:18px;color:var(--muted)}
.scroller .play{min-width:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:20px;line-height:1}
.scroller .play small{font-size:10px;color:var(--muted);letter-spacing:.08em;margin-top:3px}
.scroller.on{border-color:var(--accent)}.scroller.on .play{color:var(--accent)}
@media (max-width:420px){.nav{padding:6px 10px}.nav b{font-size:14px}}

/* sheet */
.shade{position:fixed;inset:0;z-index:20;background:var(--shade);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:720px;max-height:88vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;
  padding:14px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sheet-h h3{flex:1;min-width:0;margin:0;font-family:var(--f-display);font-weight:800;font-size:26px;text-transform:uppercase}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.opt span{min-width:0}.opt small{display:block;color:var(--muted);font-size:13px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.seg button{min-width:48px;height:44px;border:0;background:transparent;cursor:pointer;font-weight:700;padding:0 10px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.edit{width:100%;min-height:50vh;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:12px;font-size:17px;line-height:1.45;resize:vertical}
.help{color:var(--muted);font-size:14px;margin:6px 0 12px}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.listacts .tbtn{height:44px}
.backup{display:flex;gap:10px;align-items:center;margin:0 0 12px;padding:10px 12px;border:1px solid var(--accent);border-radius:12px;font-size:14px;color:var(--muted)}
.backup span{flex:1;min-width:0}.backup .tbtn{flex:none}
.items{display:grid;gap:6px}
.it{display:flex;gap:6px;align-items:center}
.ittitle{flex:1;min-width:0;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;min-height:52px;padding:6px 12px;cursor:pointer}
.ittitle b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ittitle small{display:block;color:var(--muted);font-size:12px}
.itset{flex:1;font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.itb{display:flex;gap:4px;flex:none}
.tool:disabled{opacity:.3;cursor:default}
.fl,.form label{display:grid;gap:4px;color:var(--muted);font-size:14px;font-weight:700}
.form{display:grid;gap:12px}
.form input{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 12px;font-size:16px;color:var(--fg)}
.form .edit{min-height:45vh;color:var(--fg)}
.tip{margin:0 0 12px;padding:10px 14px;border-radius:12px;background:var(--accent-soft);border:1px solid var(--accent);font-size:15px;max-width:46ch}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;max-width:90vw;text-align:center;
  background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:14px;font-size:14px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;cursor:pointer;font-weight:700}
.pick{display:grid;gap:4px;max-height:38vh;overflow:auto;padding:2px}
.form .pk{display:flex;align-items:center;gap:12px;min-height:48px;padding:6px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);cursor:pointer;color:var(--fg);font-weight:500;font-size:16px}
.form .pk input{width:22px;height:22px;min-height:0;flex:none;accent-color:var(--accent)}
.pk span{min-width:0;flex:1;text-align:left}
.pk b{font-weight:600}
.pk small{display:block;color:var(--muted);font-size:12px}
.pickhead{display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--muted);font-size:14px;font-weight:700}
.pickhead span{display:flex;gap:14px}
.got{margin:0 0 12px;padding-left:20px;color:var(--fg)}
.got li{margin:2px 0}
.msg{width:100%;min-height:90px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:8px;font:inherit;font-size:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="wrap">
  <header class="bar">
    <button class="tool" id="homeBtn" aria-label="All songs" hidden>☰</button>
    <h1 id="title">Lyrics</h1>
    <button class="tool" id="optBtn" aria-label="Settings">Aa</button>
  </header>
  <main id="view"></main>
</div>
<nav class="dock" id="dock" hidden>
  <div class="dock-in">
    <button class="nav" id="prevBtn"><small>‹ Previous</small><b id="prevT"></b></button>
    <div class="scroller" id="scroller">
      <button class="sm" id="slower" aria-label="Scroll slower">−</button>
      <button class="play" id="scrollBtn" aria-label="Auto-scroll"><span id="scrollIcon">▶</span><small id="scrollSpd">SPD 4</small></button>
      <button class="sm" id="faster" aria-label="Scroll faster">+</button>
    </div>
    <button class="nav next" id="nextBtn"><small>Next ›</small><b id="nextT"></b></button>
  </div>
</nav>
<input type="file" id="packFile" accept=".json,application/json,text/plain" hidden>
<div id="sheetHost"></div>
<div class="toast" id="toast" role="status"></div>

<script type="application/json" id="example">__EXAMPLE__</script>
<script>
/*__CORE__*/
const $=id=>document.getElementById(id);
const store={get(k,d){try{const v=localStorage.getItem('ly-'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},
             set(k,v){try{localStorage.setItem('ly-'+k,JSON.stringify(v)); if(MINE.test(k)) localStorage.setItem('ly-dirty',String(Date.now())); return true}catch(e){return false}},
             del(k){try{localStorage.removeItem('ly-'+k); if(MINE.test(k)) localStorage.setItem('ly-dirty',String(Date.now()))}catch(e){}}};
const MINE=/^(pack|edit:|note:)/;   // your gigs, lyrics and notes: changes the reminder asks you to save to a file
try{ navigator.storage&&navigator.storage.persist&&navigator.storage.persist(); }catch(e){}   // ask the phone not to clear our data
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let tt; function toast(m,ms){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),ms||1800)}

/* ---------- data ---------- */
// The example gig ships with the page. Everything else lives in this device's library (ly-pack): the gigs,
// and the lyrics by id. Old v1 lyrics files load into the same place.
const EXAMPLE=JSON.parse($('example').textContent); EXAMPLE.gig.ex=true;
Object.defineProperty(EXAMPLE.gig,'name',{get:()=>tr('Example gig')});
const emptyLib=()=>({kind:'lyrics-pack',v:2,gigs:[],texts:{}});
let PACK=store.get('pack',null); PACK=PACK&&Array.isArray(PACK.gigs)?sanitizeLib(PACK):null;
const LIBRARY=()=>PACK||emptyLib();
let GIGS=[], LIB=Object.create(null);
const own=(o,k)=>!!o&&typeof k==='string'&&Object.prototype.hasOwnProperty.call(o,k);   // a song called "constructor" is just a song
function build(){
  GIGS=[]; LIB=Object.create(null);
  const lib=LIBRARY();
  // canonical lyrics per title: first gig in the library that has it (files list the newest gig first)
  lib.gigs.forEach(g=>g.sets.forEach(s=>s.songs.forEach(x=>{ const k=norm(x.t); if(!(k in LIB)&&own(lib.texts,x.x)) LIB[k]=lib.texts[x.x]; })));
  // the example gig steps aside once you have a gig of your own (Aa can bring it back)
  if(!lib.gigs.length||prefs.showExample) GIGS.push(EXAMPLE.gig);
  lib.gigs.forEach(g=>GIGS.push(g));
  GIGS.forEach(g=>{ g.songs=[]; g.sets.forEach(s=>s.songs.forEach(x=>{ x.set=s.name; x.gig=g; x.idx=g.songs.length; x.no=String(g.songs.length+1); g.songs.push(x); })); });
}
function lyricsOf(x){
  const ed=store.get('edit:'+norm(x.t),null); if(ed!==null) return {text:ed,edited:true};
  const texts=x.gig&&x.gig.ex?EXAMPLE.texts:LIBRARY().texts;
  if(x.x&&own(texts,x.x)&&typeof texts[x.x]==='string') return {text:texts[x.x]};
  const k=norm(x.t); if(!(x.gig&&x.gig.ex)&&LIB[k]) return {text:LIB[k]};
  return {text:''};
}
let GIG=null, cur=-1, query='';
function useGig(id){ GIG=GIGS.find(g=>g.id===id)||GIGS[0]; store.set('gig',GIG.id); }

/* ---------- prefs ---------- */
const prefs=Object.assign({scale:1,theme:null,speed:4,cols:false,showExample:false,lang:'en'},store.get('prefs',{}));
const savePrefs=()=>store.set('prefs',prefs);
build();
if(PACK&&!store.get('migratedPlayed',false)){ migratePlayed(PACK.gigs,k=>store.get(k,false),(k,v)=>store.set(k,v),k=>store.del(k)); store.set('migratedPlayed',true); }
function setScale(v){prefs.scale=Math.min(2,Math.max(.7,Math.round(v*100)/100));document.documentElement.style.setProperty('--scale',prefs.scale);savePrefs()}
setScale(prefs.scale);
if(prefs.theme) document.documentElement.dataset.theme=prefs.theme;
const isDark=()=>{const t=document.documentElement.dataset.theme;return t?t==='dark':!matchMedia('(prefers-color-scheme: light)').matches};

/* ---------- language ---------- */
const BG={
 'All songs':'Всички песни','Settings':'Настройки','‹ Previous':'‹ Предишна','Next ›':'Следваща ›','Scroll slower':'По-бавно','Auto-scroll':'Авто-скрол','Scroll faster':'По-бързо',
 'No lyrics':'Няма текст','Choose gig':'Избери участие','1 song':'1 песен','{0} songs':'{0} песни','Find a song or a line of lyrics':'Търси песен или ред от текст','Clear ✓':'Изчисти ✓',
 'New lyrics file':'Нов файл с текстове','There is a newer lyrics file with all your gigs. Load it once and you’re up to date. Your own changes and notes stay.':'Има по-нов файл с текстове с всичките ти участия. Зареди го веднъж и си в час. Твоите промени и бележки остават.',
 'Load lyrics file':'Зареди файла с текстове','How do I get the file?':'Как да взема файла?',
 'Welcome':'Добре дошъл','This is an example gig. Open a song and try it: big readable lyrics, the chorus shaded, auto-scroll, swipe to the next song. Then make your own gig.':'Това е примерно участие. Отвори песен и пробвай: голям четим текст, оцветен припев, авто-скрол, плъзни към следващата песен. После направи свое участие.',
 'Make my gig':'Направи моето участие','Load a file':'Зареди файл','Help':'Помощ','Got it':'Разбрах','Make it yours':'Направи го свое',

const SAVE_FAIL='Couldn’t save on this device. Is storage full or private browsing on?';
let warned=0; const warnSave=()=>{ if(Date.now()-warned>5000){ warned=Date.now(); toast(tr(SAVE_FAIL),3500); } };
const plainSongL=x=>{ const y={t:x.t}; if(x.a) y.a=x.a; if(x.x) y.x=x.x; return y; };
const plainGigL=g=>({id:g.id,name:g.name,sets:g.sets.map(s=>({name:s.name,songs:s.songs.map(plainSongL)}))});
const plainLib=lib=>({kind:'lyrics-pack',v:lib.v||2,made:lib.made||'',gigs:lib.gigs.map(plainGigL),texts:lib.texts||{}});
function saveLib(lib){ const p=plainLib(lib); if(!store.set('pack',p)){ toast(tr(SAVE_FAIL),3500); return false; } PACK=p; build(); return true; }
const gigById=id=>LIBRARY().gigs.find(g=>g.id===id);
let editing=null;
function newGig(){
  const g={id:newId(Date.now()),name:tr('My gig'),sets:[{name:'',songs:[]}]}, lib=plainLib(LIBRARY());
  lib.gigs.push(g); if(saveLib(lib)) location.hash='edit-'+g.id;
}
function withGig(id,fn){ const lib=plainLib(LIBRARY()); const g=lib.gigs.find(x=>x.id===id); fn(g,lib); return lib; }
function showGigEditor(id){
  const g=gigById(id); if(!g){ location.hash=''; return; }
  editing=id; cur=-1; stopScroll(); $('homeBtn').hidden=false; $('dock').hidden=true; $('title').textContent=tr('Edit gig');
  const items=flattenGig(plainGigL(g));
  const row=(it,i)=>`<div class="it">${it.k==='set'?`<input class="find itset" data-i="${i}" value="${esc(it.name)}" placeholder="${tr('Set name')}" aria-label="${tr('Set name')}">`
    :`<button class="ittitle" data-edit="${i}"><b>${esc(it.song.t)}</b>${it.song.a?`<small>${esc(it.song.a)}</small>`:''}</button>`}
    <span class="itb"><button class="tool" data-mv="-1" data-i="${i}" aria-label="${tr('Move up')}"${i?'':' disabled'}>↑</button><button class="tool" data-mv="1" data-i="${i}" aria-label="${tr('Move down')}"${i<items.length-1?'':' disabled'}>↓</button><button class="tool" data-del="${i}" aria-label="${tr('Remove')}">✕</button></span></div>`;
  view.innerHTML=`<div class="list">
    <label class="fl">${tr('Gig name')}<input class="find" id="gigName" value="${esc(g.name)}" maxlength="40" autocomplete="off"></label>
    <div class="items">${items.map(row).join('')||`<p class="empty">${tr('No songs yet. Add your first song.')}</p>`}</div>
    <div class="acts"><button class="tbtn primary" id="addSong">${tr('＋ Song')}</button><button class="tbtn" id="addSet">${tr('＋ Set')}</button></div>
    <div class="acts"><button class="tbtn" id="sendGig">${tr('↗ Send')}</button><button class="tbtn" id="saveGigFile">${tr('Save gig to file')}</button><button class="tbtn" id="delGig">${tr('Delete gig')}</button><button class="tbtn primary" id="doneGig">${tr('Done')}</button></div></div>`;
  const put=list=>{ if(saveLib(withGig(id,gg=>{ gg.sets=unflattenGig(list); }))) showGigEditor(id); };
  $('gigName').onchange=e=>{ const v=e.target.value.trim()||tr('My gig'); if(saveLib(withGig(id,gg=>{ gg.name=v; }))) toast(tr('Saved')); };
  view.querySelectorAll('.itset').forEach(inp=>inp.onchange=()=>{ items[+inp.dataset.i].name=inp.value.trim(); put(items); });
  view.querySelectorAll('[data-mv]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.i, j=i+(+b.dataset.mv); if(j<0||j>=items.length) return; [items[i],items[j]]=[items[j],items[i]]; put(items); });
  view.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.del, it=items[i]; if(it.k==='song'&&!confirm(tr('Remove “{0}” from this gig?',it.song.t))) return; items.splice(i,1); put(items); });
  view.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.edit; let n=-1; for(let k=0;k<=i;k++) if(items[k].k==='song') n++; openSongEditor(id,n); });
  $('addSong').onclick=()=>openSongEditor(id,-1);
  $('addSet').onclick=()=>{ items.push({k:'set',name:tr('Set {0}',unflattenGig(items).length+1)}); put(items); };
  $('delGig').onclick=()=>{ if(!confirm(tr('Delete the gig “{0}” from this device?',g.name))) return; const lib=plainLib(LIBRARY()); lib.gigs=lib.gigs.filter(x=>x.id!==id); if(saveLib(lib)){ store.set('gig',GIGS[0].id); location.hash=''; toast(tr('Gig deleted')); } };
  $('doneGig').onclick=()=>{ location.hash='g-'+id; };
  $('saveGigFile').onclick=()=>saveFile([gigById(id)]);
  $('sendGig').onclick=()=>openSend(id);
}
// n = position of the song in the gig (0-based, across sets); -1 = new song at the end
function openSongEditor(gigId,n){
  const g=GIGS.find(x=>x.id===gigId), song=n>=0?g.songs[n]:null, text=song?lyricsOf(song).text:'';
  openSheet(song?tr('Edit song'):tr('New song'),`<div class="form">
    <label>${tr('Title')}<input id="fTitle" value="${esc(song?song.t:'')}" maxlength="80" autocomplete="off"></label>
    <label>${tr('Artist')}<input id="fArtist" value="${esc(song&&song.a||'')}" maxlength="80" autocomplete="off"></label>
    <label>${tr('Lyrics')}<textarea class="edit" id="fLyrics" placeholder="${tr('Paste or type the lyrics here')}">${esc(text)}</textarea></label>
    <p class="help">${tr('Leave an empty line between verses. Write Chorus on its own line above the chorus to mark it.')}</p>
    <div class="acts"><button class="tbtn primary" id="fSave">${tr('Save')}</button><button class="tbtn" id="fCancel">${tr('Cancel')}</button>${song?`<button class="tbtn" id="fDelete">${tr('Delete song')}</button>`:''}</div></div>`,()=>{
    $('fCancel').onclick=closeSheet;
    $('fSave').onclick=()=>{
      const t=$('fTitle').value.trim(); if(!t){ toast(tr('Give the song a title')); $('fTitle').focus(); return; }
      const hadEdit=!!song&&store.get('edit:'+norm(song.t),null)!==null;
      const body=$('fLyrics').value.replace(/\r/g,'').replace(/\s+$/,'');
      const data={t}; const a=$('fArtist').value.trim(); if(a) data.a=a;
      const lib=withGig(gigId,(gg,L)=>{
        if(body){ data.x=hashText(body); L.texts[data.x]=body; }
        if(n<0){ if(!gg.sets.length) gg.sets.push({name:'',songs:[]}); gg.sets[gg.sets.length-1].songs.push(data); return; }
        let k=0; gg.sets.forEach(s=>s.songs.forEach((x,i)=>{ if(k++===n) s.songs[i]=data; }));
      });
      if(!saveLib(lib)) return;
      if(song){ const o=norm(song.t), nn=norm(t);
        // a pasted fix (edit:) applies to this title in every gig: keep it in step with the newest text
        // your fix wins over any newer file (Update/Replace keep it), in every gig with this title
        if(hadEdit||body!==text){ if(o!==nn) store.del('edit:'+o); if(body){ if(!store.set('edit:'+nn,body)) warnSave(); } else store.del('edit:'+nn); }
        // move the note and the sung mark with the song, never over another song's, and only once the copy is saved
        const move=(from,to)=>{ const v=store.get(from,null); if(v!==null&&store.get(to,null)===null){ if(store.set(to,v)) store.del(from); else warnSave(); } };
        if(o!==nn){ move('note:'+o,'note:'+nn); move('played:'+gigId+':'+o,'played:'+gigId+':'+nn); } }
      closeSheetQuiet(); route(); toast(tr('Saved'));
    };
    if($('fDelete')) $('fDelete').onclick=()=>{ if(!confirm(tr('Delete “{0}”?',song.t))) return;
      const lib=withGig(gigId,gg=>{ let k=0; gg.sets.forEach(s=>{ s.songs=s.songs.filter(()=>k++!==n); }); });
      if(saveLib(lib)){ closeSheetQuiet(); route(); toast(tr('Song deleted')); } };
  });
}

/* ---------- files ---------- */
const today=()=>new Date().toISOString().slice(0,10);
function downloadJSON(name,obj){
  const text=JSON.stringify(obj,null,1), blob=new Blob([text],{type:'application/json'});
  try{ const f=new File([blob],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[f]})&&/iPhone|iPad|Android/i.test(navigator.userAgent)){ return navigator.share({files:[f],title:name}).then(()=>true,()=>false); } }catch(e){}
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1000);
  return Promise.resolve(true);
}
const fileName=n=>(n.replace(/[\\/:*?"<>|]+/g,'').trim()||'gig')+'.lyrics.json';
function saveFile(gigs,name){
  const ids=new Set(gigs.map(g=>g.id)), live=GIGS.filter(g=>ids.has(g.id));
  // your own backup: the lyrics as you edited them, plus your notes
  const notes={}; live.forEach(g=>g.songs.forEach(x=>{ const n=store.get('note:'+norm(x.t),''); if(n) notes[x.t]=String(n); }));
  const all=live.length===LIBRARY().gigs.length;
  return downloadJSON(name||fileName(gigs[0].name),Object.assign(makeLyricsFile(live,x=>lyricsOf(x).text,today()),{notes}))
    .then(ok=>{ if(ok&&all){ store.set('saved',Date.now()); if(cur<0&&!editing&&$('listBody')) showList(); } return ok; });
}
function restoreNotes(notes){
  if(!notes||typeof notes!=='object') return;
  Object.keys(notes).forEach(t=>{ const n=notes[t]; if(typeof n==='string'&&n&&!store.get('note:'+norm(t),'')) store.set('note:'+norm(t),n.slice(0,5000)); });
}
function pickFile(){ $('packFile').click(); }
function finishImport(file,mode,notes){
  const before=new Set(LIBRARY().gigs.map(g=>g.id));
  const lib=applyLyricsImport(plainLib(LIBRARY()),file,mode); lib.made=file.made||lib.made;
  if(!saveLib(lib)) return;
  if(notes){ restoreNotes(notes); if(file.gigs.length>=before.size) store.set('saved',Date.now()); }   // you just loaded your own backup
  closeSheetQuiet(); const n=file.gigs.length; toast(n===1?tr('Loaded 1 gig'):tr('Loaded {0} gigs',n),2600);
  // open the file's first gig: its renamed copy when kept as a second copy, else the gig itself
  const first=mode==='keep'&&before.has(file.gigs[0].id)?lib.gigs.find(g=>!before.has(g.id)):lib.gigs.find(g=>g.id===file.gigs[0].id);
  const h='#g-'+(first?first.id:GIGS[0].id); if(location.hash===h) route(); else location.hash=h;
}
function importText(text){
  let o=null; try{ o=JSON.parse(text); }catch(e){}
  const v=validateLyricsFile(o); if(!v.ok){ toast(tr('That isn’t a lyrics file'),3500); return; }
  if(o.from!==undefined){ offerFile(v.file,senderName(o.from)); return; }   // a file someone sent with ↗ Send
  const clash=importConflicts(LIBRARY().gigs,v.file.gigs);
  if(!clash.length){ finishImport(v.file,'keep',o.notes); return; }
  const names=clash.map(id=>gigById(id).name);
  openSheet(tr('Already on this device'),`<p class="help">${tr(clash.length===1?'This gig is already here: {0}. Replace it with the file, or keep both?':'These gigs are already here: {0}. Replace them with the file, or keep both?','<b>'+names.map(esc).join(', ')+'</b>')}</p>
    <div class="acts"><button class="tbtn primary" id="impReplace">${tr('Replace')}</button><button class="tbtn" id="impKeep">${tr('Keep both')}</button><button class="tbtn" id="impCancel">${tr('Cancel')}</button></div>`,()=>{
    $('impReplace').onclick=()=>finishImport(v.file,'replace',o.notes);
    $('impKeep').onclick=()=>finishImport(v.file,'keep');
    $('impCancel').onclick=closeSheetQuiet;
  });
}

/* ---------- wake lock ---------- */
let lock=null,wantLock=false;
async function grabLock(){ const l=await navigator.wakeLock.request('screen'); l.addEventListener('release',()=>{ if(lock===l) lock=null; }); lock=l; }
async function wakeOn(){ wantLock=true;
  if(!('wakeLock' in navigator)){toast(tr('Can’t keep the screen on here — raise Auto-Lock in Settings'),3000);return}
  try{await grabLock();toast(tr('Screen stays on'))}catch(e){lock=null;toast(tr('Screen lock not allowed here'))} }
async function wakeOff(){ wantLock=false; try{if(lock)await lock.release()}catch(e){} lock=null; toast(tr('Screen can turn off')); }
document.addEventListener('visibilitychange',async()=>{ if(document.visibilityState==='visible'){ lastT=0; if(wantLock&&!lock){try{await grabLock()}catch(e){}} } });

/* ---------- auto-scroll ---------- */
let scrolling=false,rafId=0,lastT=0,acc=0;
const pxPerSec=()=>5+prefs.speed*5;
function tick(t){ if(!scrolling) return;
  if(lastT){acc+=pxPerSec()*Math.min(t-lastT,100)/1000;const s=Math.floor(acc);if(s){scrollBy(0,s);acc-=s}}
  lastT=t;
  if(innerHeight+scrollY>=document.documentElement.scrollHeight-2){stopScroll();toast(tr('End of song'));return}
  rafId=requestAnimationFrame(tick); }
function startScroll(){scrolling=true;lastT=0;acc=0;rafId=requestAnimationFrame(tick);syncScroll();if(!lock&&!wantLock)wakeOn()}
function stopScroll(){scrolling=false;cancelAnimationFrame(rafId);syncScroll()}
function syncScroll(){$('scroller').classList.toggle('on',scrolling);$('scrollIcon').textContent=scrolling?'❚❚':'▶';$('scrollSpd').textContent='SPD '+prefs.speed}
$('scrollBtn').onclick=()=>scrolling?stopScroll():startScroll();
$('slower').onclick=()=>{prefs.speed=Math.max(1,prefs.speed-1);savePrefs();syncScroll()};
$('faster').onclick=()=>{prefs.speed=Math.min(15,prefs.speed+1);savePrefs();syncScroll()};
syncScroll();

// Links sent with an earlier version (#get=…) still open.
async function receiveLink(code){
  history.replaceState(null,'',location.pathname+location.search);   // a refresh won't ask again
  route();
  let o=null, old=false; try{ o=await unpackShare(code); }catch(e){ old=e&&e.message==='old browser'; }
  const v=validateLyricsFile(o);
  if(!v.ok){ openSheet(tr('Link not working'),`<p class="help">${tr(old?'Update your browser to open this link, or ask for the file.':'This link is broken or was cut off. Ask for it again, or ask for the file.')}</p>`); return; }
  offerFile(v.file,senderName(o.from));
}
function offerFile(file,from){
  const g=file.gigs[0], titles=gigSongs(g).map(x=>x.t), have=file.gigs.some(x=>gigById(x.id));
  openSheet(from?tr('{0} sent you a gig',from):tr('New gig'),`<p class="help" style="margin-bottom:8px"><b style="color:var(--fg);font-size:18px">${esc(g.name)}</b> · ${songsN(titles.length)}</p>

    ${have?`<p class="help">${tr('You already have this gig. Updating it keeps your notes and ✓ marks.')} ${tr('Lyrics you fixed yourself stay as you fixed them.')} ${tr('Songs you have that aren’t in the file stay.')}</p>`:''}
    <div class="acts"><button class="tbtn primary" id="rAdd">${have?tr('Update it'):tr('Add it')}</button><button class="tbtn" id="rCancel">${tr('Cancel')}</button></div>`,()=>{
    $('rAdd').onclick=()=>{ if(have) file=Object.assign({},file,{gigs:file.gigs.map(g=>keepMissing(LIBRARY().gigs.find(l=>l.id===g.id),g,'t'))}); finishImport(file,have?'replace':'keep'); };
    $('rCancel').onclick=closeSheet;
  });

/* ---------- navigation ---------- */
function route(){
  const code=shareCodeOf(location.hash); if(code){ receiveLink(code); return; }
  closeSheet(); editing=null;
  const h=location.hash.slice(1); let m;
  if((m=h.match(/^edit-([a-z0-9]+)$/))&&gigById(m[1])){ useGig(m[1]); showGigEditor(m[1]); return; }
  if((m=h.match(/^g-([a-z0-9]+)$/))){ useGig(m[1]); showList(); return; }
  if((m=h.match(/^([a-z0-9]+)-(\d+)$/))&&GIGS.some(g=>g.id===m[1])){ useGig(m[1]); const i=+m[2]-1; if(i>=0&&i<GIG.songs.length){ const y=i===cur?scrollY:0; showSong(i); scrollTo(0,y); return; } }
  useGig(store.get('gig',GIGS[0].id)); showList();
}
addEventListener('hashchange',route);
$('homeBtn').onclick=()=>{location.hash='g-'+GIG.id};
$('prevBtn').onclick=()=>{if(cur>0)location.hash=GIG.id+'-'+cur};
$('nextBtn').onclick=()=>{if(cur<GIG.songs.length-1)location.hash=GIG.id+'-'+(cur+2)};
let tx=0,ty=0;
document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
document.addEventListener('touchend',e=>{ if(cur<0||sheetOpen()) return; if(e.target.closest&&e.target.closest('textarea,input')) return;
  const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>70&&Math.abs(dy)<50) (dx<0?$('nextBtn'):$('prevBtn')).click(); },{passive:true});
document.addEventListener('keydown',e=>{
  if(e.target.matches&&e.target.matches('input,textarea')){ if(e.target.id==='mynote'&&/^Page(Up|Down)$/.test(e.key)) e.target.blur(); else return; }   // a pedal still works after typing a note
  if(e.key==='Escape'){ sheetOpen()?closeSheet():cur>=0&&$('homeBtn').click(); return; }
  if(cur<0||sheetOpen()) return;
  const atB=innerHeight+scrollY>=document.documentElement.scrollHeight-4, atT=scrollY<=2;
  if(e.key==='ArrowRight'){e.preventDefault();$('nextBtn').click()}
  else if(e.key==='ArrowLeft'){e.preventDefault();$('prevBtn').click()}
  else if(e.key==='PageDown'||e.key==='ArrowDown'||(e.key===' '&&e.target===document.body)){e.preventDefault();atB?$('nextBtn').click():scrollBy(0,innerHeight*.75)}
  else if(e.key==='PageUp'||e.key==='ArrowUp'){e.preventDefault();atT?$('prevBtn').click():scrollBy(0,-innerHeight*.75)}
  else if(e.key==='s'){scrolling?stopScroll():startScroll()}
});
route();
// Works offline once opened (GitHub Pages only)
if('serviceWorker' in navigator&&location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
